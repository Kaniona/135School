<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>135 Мектеп — Ас мәзірі</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.menu-content p { margin-bottom: 15px; }
.menu-content h3 { margin-top: 25px; margin-bottom: 15px; color: var(--primary); }
.menu-content h4 { margin-top: 0; margin-bottom: 10px; }
.menu-content ul { list-style-type: none; padding-left: 0; margin-bottom: 10px; }
.menu-content li { padding: 4px 0; border-bottom: 1px dotted var(--border); }
.menu-content li:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="toast-container"></div>
<div id="app" class="app-layout">
  <div class="main-content" id="main">
    <header class="page-header">
      <button class="hamburger-btn btn-ghost" id="hamburger-btn">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="ph-title" id="page-title">Ас мәзірі</h1>
      <div class="ph-actions" id="page-actions"></div>
    </header>
    <div class="page-body page-enter" id="content"></div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
if(!initApp()) throw '';
injectSidebar();
buildSidebar();
initSidebar();

const defaultMenuData = {
    date: "01.04.2026 ж.",
    title: "👨‍👩‍👧‍👦 Әлеуметтік жағдайы төмен отбасынан шыққан оқушыларға арналған\\n👥 Оқушылар саны: 159 (1–4 сынып: 100, қамтылғаны: 59)",
    menu_1_4: "🥣 Сүтті тары ботқасы – 200 г\\n🥤 “Денсаулық сусыны” – 200 г\\n🍎 Алма – 120 г\\n🍞 Қара бидай наны – 20 г",
    info_1_4: "💰 Рацион бағасы: 352,16 тг | ҚҚС-пен: 408,51 тг\\n🔥 Калориясы: 413,42 ккал | Ақуыз: 9,54 г | Май: 8,47 г | Көмірсу: 73,28 г",
    menu_5_9: "🥣 Сүтті тары ботқасы – 230 г\\n🥤 “Денсаулық сусыны” – 200 г\\n🍎 Алма – 120 г\\n🍞 Қара бидай наны – 35 г",
    info_5_9: "💰 Рацион бағасы: 373,81 тг | ҚҚС-пен: 433,62 тг\\n🔥 Калориясы: 483,75 ккал | Ақуыз: 11,66 г | Май: 9,83 г | Көмірсу: 85,47 г",
    menu_10_11: "🥣 Сүтті тары ботқасы – 250 г\\n🥤 “Денсаулық сусыны” – 200 г\\n🍎 Алма – 120 г\\n🍞 Қара бидай наны – 40 г",
    info_10_11: "💰 Рацион бағасы: 409,56 тг | ҚҚС-пен: 475,09 тг\\n🔥 Калориясы: 519,40 ккал | Ақуыз: 12,80 г | Май: 10,69 г | Көмірсу: 91,30 г",
    additional: "“Денсаулық сусыны” құрамы:\\nЛимон 🍋, Алма 🍎, Қант, Су 💧\\n\\nСүтті тары ботқасының құрамы:\\nТары жармасы, Сары май, Тұз, Сүт (2,5%), Қант"
};

function render() {
  const isAdm = hasAnyRole(['super_admin','admin','director','deputy_director']);
  
  let menus = demoDB.get('menus_structured');
  if(menus.length === 0) {
    menus = [ { id: 'm1', data: defaultMenuData, updatedAt: new Date().toISOString() } ];
    demoDB.set('menus_structured', menus);
  }
  const currentMenu = menus[0].data;

  let actionsHtml = '';
  if(isAdm) {
    actionsHtml = `<button class="btn btn-primary" onclick="window.openEditModal()">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-right:6px">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
      Өңдеу
    </button>`;
  }
  document.getElementById('page-actions').innerHTML = actionsHtml;

  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:1000px;margin:20px auto">
      <div class="card-body" style="padding:30px">
        
        <div style="text-align:center;margin-bottom:30px">
            <h2 style="margin:0 0 10px 0;font-size:22px">📋 №135 мектеп КММ — Ас мәзірі</h2>
            <div class="badge badge-blue" style="font-size:14px;padding:6px 12px">🗓️ Күні: ${currentMenu.date}</div>
            <div style="margin-top:15px;color:var(--text2);white-space:pre-wrap;font-size:15px;line-height:1.5">${currentMenu.title}</div>
        </div>

        <div class="table-wrapper" style="margin-bottom:30px">
            <table style="width:100%">
                <thead>
                    <tr>
                        <th style="width:20%">Сыныптар</th>
                        <th style="width:40%">🍽️ Ас мәзірі</th>
                        <th style="width:40%">📊 Құндылығы / Бағасы</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="fw-600">🧒 1–4 сынып</div><div class="text-xs text-muted mt-4">7–10 жас</div></td>
                        <td style="white-space:pre-wrap;line-height:1.6">${currentMenu.menu_1_4}</td>
                        <td style="white-space:pre-wrap;line-height:1.6;color:var(--text2);font-size:13.5px">${currentMenu.info_1_4}</td>
                    </tr>
                    <tr>
                        <td><div class="fw-600">🧑 5–9 сынып</div><div class="text-xs text-muted mt-4">11–14 жас</div></td>
                        <td style="white-space:pre-wrap;line-height:1.6">${currentMenu.menu_5_9}</td>
                        <td style="white-space:pre-wrap;line-height:1.6;color:var(--text2);font-size:13.5px">${currentMenu.info_5_9}</td>
                    </tr>
                    <tr>
                        <td><div class="fw-600">🧑‍🎓 10–11 сынып</div><div class="text-xs text-muted mt-4">15–18 жас</div></td>
                        <td style="white-space:pre-wrap;line-height:1.6">${currentMenu.menu_10_11}</td>
                        <td style="white-space:pre-wrap;line-height:1.6;color:var(--text2);font-size:13.5px">${currentMenu.info_10_11}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h3 style="font-size:18px;margin-bottom:15px;color:var(--primary)">🧾 Қосымша ақпарат</h3>
        <div style="background:var(--bg2);padding:15px;border-radius:var(--radius);white-space:pre-wrap;line-height:1.6;font-size:14.5px">
            ${currentMenu.additional}
        </div>

      </div>
      <div class="text-xs text-muted" style="padding:15px 30px; border-top:1px solid var(--border); background: var(--bg2); border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius)">
        Соңғы жаңартылған: ${formatDateTime(menus[0].updatedAt)}
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="menu-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;opacity:0;transition:0.3s;pointer-events:none">
        <div class="modal card" style="width:900px;max-width:95%;max-height:90vh;display:flex;flex-direction:column;transform:translateY(20px);transition:0.3s">
            <div class="card-header">
                <span class="card-title">Менюді өңдеу (Текст)</span>
                <button class="btn-ghost btn-sm" onclick="closeModal('menu-modal')">✕</button>
            </div>
            <div class="card-body" style="overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px">
                <div style="display:grid;grid-template-columns:1fr 2fr;gap:15px">
                    <div class="form-group">
                        <label>🗓️ Күні:</label>
                        <input type="text" id="m-date" class="input" style="width:100%">
                    </div>
                    <div class="form-group">
                        <label>📝 Сипаттама (Кімдерге арналған):</label>
                        <textarea id="m-title" class="input" rows="2" style="width:100%;resize:vertical"></textarea>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;background:var(--bg2);padding:15px;border-radius:var(--radius)">
                    <div class="form-group mb-0">
                        <label>🧒 1-4 сынып (Ас мәзірі):</label>
                        <textarea id="m-menu1" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                    <div class="form-group mb-0">
                        <label>📊 1-4 сынып (Құндылығы/Бағасы):</label>
                        <textarea id="m-info1" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;background:var(--bg2);padding:15px;border-radius:var(--radius)">
                    <div class="form-group mb-0">
                        <label>🧑 5-9 сынып (Ас мәзірі):</label>
                        <textarea id="m-menu2" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                    <div class="form-group mb-0">
                        <label>📊 5-9 сынып (Құндылығы/Бағасы):</label>
                        <textarea id="m-info2" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;background:var(--bg2);padding:15px;border-radius:var(--radius)">
                    <div class="form-group mb-0">
                        <label>🧑‍🎓 10-11 сынып (Ас мәзірі):</label>
                        <textarea id="m-menu3" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                    <div class="form-group mb-0">
                        <label>📊 10-11 сынып (Құндылығы/Бағасы):</label>
                        <textarea id="m-info3" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>ℹ️ Қосымша ақпарат (Құрамы т.б.):</label>
                    <textarea id="m-add" class="input" rows="4" style="width:100%;resize:vertical"></textarea>
                </div>

            </div>
            <div class="card-footer" style="padding:15px;display:flex;justify-content:flex-end;gap:10px;background:var(--bg2)">
                <button class="btn btn-secondary" onclick="closeModal('menu-modal')">Бас тарту</button>
                <button class="btn btn-primary" onclick="window.saveMenu()">Сақтау</button>
            </div>
        </div>
    </div>
  `;
}

// To fix modal css overriding, I will inject a style rule manually but using `shared.js` openModal works if `.modal-overlay.open` exists.
// The default modal styling requires this.
document.addEventListener("DOMContentLoaded", () => {
    const style = document.createElement('style');
    style.innerHTML = `
      #menu-modal.open { display: flex !important; opacity: 1 !important; pointer-events: auto !important; }
      #menu-modal.open .modal { transform: translateY(0) !important; }
    `;
    document.head.appendChild(style);
});

window.openEditModal = function() {
    const menus = demoDB.get('menus_structured');
    const data = menus[0].data;
    document.getElementById('m-date').value = data.date;
    document.getElementById('m-title').value = data.title;
    document.getElementById('m-menu1').value = data.menu_1_4;
    document.getElementById('m-info1').value = data.info_1_4;
    document.getElementById('m-menu2').value = data.menu_5_9;
    document.getElementById('m-info2').value = data.info_5_9;
    document.getElementById('m-menu3').value = data.menu_10_11;
    document.getElementById('m-info3').value = data.info_10_11;
    document.getElementById('m-add').value = data.additional;
    
    document.getElementById('menu-modal').classList.add('open');
}

window.closeModal = function(id) {
    document.getElementById(id).classList.remove('open');
}

window.saveMenu = function() {
    const menus = demoDB.get('menus_structured');
    const newData = {
        date: document.getElementById('m-date').value,
        title: document.getElementById('m-title').value,
        menu_1_4: document.getElementById('m-menu1').value,
        info_1_4: document.getElementById('m-info1').value,
        menu_5_9: document.getElementById('m-menu2').value,
        info_5_9: document.getElementById('m-info2').value,
        menu_10_11: document.getElementById('m-menu3').value,
        info_10_11: document.getElementById('m-info3').value,
        additional: document.getElementById('m-add').value
    };
    menus[0].data = newData;
    menus[0].updatedAt = new Date().toISOString();
    demoDB.set('menus_structured', menus);
    closeModal('menu-modal');
    showToast('Ас мәзірі сәтті сақталды!', 'success');
    render();
}

render();
</script>
</body>
</html>
