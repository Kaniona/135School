<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>135 Мектеп — Мұғалімдер</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.teacher-card{background:linear-gradient(150deg, var(--surface), var(--bg2));border:1px solid rgba(255,255,255,0.05);border-radius:20px;overflow:hidden;transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);cursor:pointer;position:relative;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.teacher-card::before{content:'';position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(135deg, rgba(37,99,235,0.15), rgba(139,92,246,0.15));z-index:0;border-bottom:1px solid rgba(255,255,255,0.02)}
.teacher-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 15px 35px rgba(37,99,235,0.2), 0 0 0 1px var(--primary)}
.teacher-card:hover .t-photo{transform:scale(1.08) rotate(3deg);box-shadow:0 0 25px rgba(139,92,246,0.5)}
.teacher-card-body{padding:16px 20px 24px;text-align:center;position:relative;z-index:1}
.teacher-name{font-weight:800;font-size:18px;margin-bottom:6px;background:linear-gradient(to right, #fff, var(--text2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.teacher-subjects{font-size:11px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.t-photo-wrap{position:relative;z-index:1;padding:24px 16px 0;display:flex;justify-content:center}
.t-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.t-photo-placeholder{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg, var(--primary), var(--purple));display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff;border:4px solid var(--surface);box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.stars-display{display:flex;justify-content:center;gap:4px;margin-bottom:12px}
.stars-display .st{font-size:18px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.stars-display .st.f{color:#F59E0B;text-shadow:0 0 10px rgba(245,158,11,0.4)}
.stars-display .st.e{color:var(--border2)}
</style>
</head>
<body>
<div id="toast-container"></div>
<div id="app" class="app-layout">
  <div class="main-content">
    <header class="page-header">
      <button class="hamburger-btn btn-ghost" id="hamburger-btn">☰</button>
      <h1 class="ph-title">👨‍🏫 Мұғалімдер</h1>
      <div class="ph-actions">
        <button class="btn btn-primary btn-sm" id="add-btn" onclick="openAddModal()" style="display:none">+ Қосу</button>
      </div>
    </header>
    <div class="page-body page-enter">
      <div class="search-bar mb-16">
        <div class="search-input-wrapper"><span class="icon">🔍</span><input id="search-inp" class="form-control" placeholder="Аты немесе пән бойынша..." oninput="render()"></div>
        <select id="subj-filter" class="form-control" style="width:180px" onchange="render()">
          <option value="">Барлық пән</option>
        </select>
      </div>
      <div id="content"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="teacher-modal">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title" id="modal-title">Мұғалім қосу</div><button class="modal-close" onclick="closeModal('teacher-modal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Аты-жөні <span class="required">*</span></label><input id="f-name" class="form-control" placeholder="Аты-жөні"></div>
        <div class="form-group"><label class="form-label">Телефон</label><input id="f-phone" class="form-control" placeholder="+77001234567"></div>
      </div>
      <div class="form-group"><label class="form-label">Кіру паролі (міндетті емес)</label><input id="f-pw" class="form-control" type="password" placeholder="Жүйеге кіру үшін"></div>
      <div class="form-group">
        <label class="form-label">Фото (міндетті емес)</label>
        <div style="display:flex;align-items:center;gap:16px">
          <input type="file" id="f-photo" class="form-control" accept="image/*" onchange="previewPhoto(this)">
          <div id="photo-preview" style="display:none;flex-shrink:0"><img id="photo-img" src="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--border)"></div>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Пәндер <span class="required">*</span></label>
        <div id="subj-checks" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px"></div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Сынып жетекші (сынып)</label>
          <select id="f-class" class="form-control"><option value="">Сынып жетекші емес</option></select>
        </div>
        <div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('teacher-modal')">Бас тарту</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveTeacher()">Сақтау</button>
    </div>
  </div>
</div>

<!-- Star Rating Modal -->
<div class="modal-overlay" id="star-modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">⭐ Жұлдыз беру</div><button class="modal-close" onclick="closeModal('star-modal')">✕</button></div>
    <div class="modal-body" id="star-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('star-modal')">Жабу</button>
      <button class="btn btn-primary" id="star-save-btn" onclick="saveStar()">Беру</button>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
if(!initApp()) throw '';
if(!hasAnyRole(['super_admin','admin','director','deputy_director'])) { location.href='dashboard.html'; throw ''; }
injectSidebar(); buildSidebar(); initSidebar();

if(isAdmin()) document.getElementById('add-btn').style.display='';

// Populate subject filter
const sf=document.getElementById('subj-filter');
SUBJECTS.forEach(s=>sf.innerHTML+=`<option value="${s}">${s}</option>`);
// Populate class dropdown in modal
const fc=document.getElementById('f-class');
CLASSES.forEach(c=>fc.innerHTML+=`<option value="${c}">${c}</option>`);

let starTeacherId = null, selectedStar = 0;

function filteredTeachers() {
  let t = demoDB.get('teachers');
  const q = document.getElementById('search-inp').value.toLowerCase();
  const sf = document.getElementById('subj-filter').value;
  if(q) t=t.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.subjects||[]).some(s=>s.toLowerCase().includes(q)));
  if(sf) t=t.filter(x=>(x.subjects||[]).includes(sf));
  return t;
}

function starsHTML(avg, size='') {
  let h='<div class="stars-display">';
  for(let i=1;i<=5;i++) h+=`<span class="st ${size} ${i<=Math.round(avg)?'f':'e'}">★</span>`;
  h+='</div>';
  return h;
}

function render() {
  const teachers = filteredTeachers();
  const c = document.getElementById('content');
  if(teachers.length===0){c.innerHTML=`<div class="empty-state"><div class="empty-icon">👨‍🏫</div><div class="empty-title">Мұғалім табылмады</div></div>`;return;}
  c.innerHTML = `<div class="teacher-grid">${teachers.map(t=>`
    <div class="teacher-card">
      <div class="t-photo-wrap">
        ${t.photoURL ? 
          `<img src="${t.photoURL}" class="t-photo">` : 
          `<div class="t-photo t-photo-placeholder">${getInitials(t.name)}</div>`
        }
      </div>
      <div class="teacher-card-body">
        <div class="teacher-name">${t.name||'—'}</div>
        <div class="teacher-subjects">${(t.subjects||[]).join(', ')||'—'}</div>
        <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px">
          ${(t.roles||['teacher']).map(r=>roleBadge(r)).join('')}
          ${t.classId?`<span class="badge badge-blue" style="box-shadow: 0 0 10px rgba(37,99,235,0.2)">${t.classId} сынып</span>`:''}
        </div>
        ${starsHTML(t.stars||0)}
        <div class="text-xs text-muted mb-16" style="font-weight:500">⭐ <span style="color:var(--warning)">${t.totalStars||0} жұлдыз</span> • ${t.starCount||0} баға</div>
        <div style="display:flex;gap:8px;justify-content:center">
          ${canRateTeacher()?`<button class="btn btn-success btn-sm" style="border-radius:12px; font-weight:700" onclick="openStarModal('${t.id}','${t.name}','${t.stars||0}')">⭐ Бағалау</button>`:''}
          ${isAdmin()?`<button class="btn btn-secondary btn-sm" style="border-radius:12px" onclick="editTeacher('${t.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" style="border-radius:12px" onclick="deleteTeacher('${t.id}')">🗑️</button>`:''}
        </div>
      </div>
    </div>`).join('')}</div>

    <!-- Ranking table -->
    <div class="card" style="margin-top:24px">
      <div class="card-header"><span class="card-title">🏆 Мұғалімдер рейтингі</span></div>
      <div class="table-wrapper" style="border:none;border-radius:0">
        <table><thead><tr><th>#</th><th>Мұғалім</th><th>Пәндер</th><th>Жұлдыз орташа</th><th>Жалпы жұлдыз</th><th>Бағалар саны</th></tr></thead>
        <tbody>${[...teachers].sort((a,b)=>(b.totalStars||0)-(a.totalStars||0)).map((t,i)=>`<tr>
          <td><span style="font-weight:800;color:${i===0?'#F59E0B':i===1?'#94A3B8':i===2?'#CD7C2F':'var(--text3)'}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span></td>
          <td><div style="display:flex;align-items:center;gap:8px">${avatarDiv(t.name, t.photoURL, 'sm')}<span class="fw-600">${t.name||'—'}</span></div></td>
          <td class="text-muted">${(t.subjects||[]).join(', ')||'—'}</td>
          <td>${starsHTML(t.stars||0)}</td>
          <td><span class="fw-700" style="color:var(--warning)">⭐ ${t.totalStars||0}</span></td>
          <td class="text-muted">${t.starCount||0}</td>
        </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function openStarModal(id, name, currentStars) {
  starTeacherId = id;
  selectedStar = 0;
  document.getElementById('star-modal-body').innerHTML = `
    <div style="text-align:center">
      <div class="avatar avatar-lg" style="margin:0 auto 12px">${getInitials(name)}</div>
      <div class="fw-700 mb-8">${name}</div>
      <div class="text-muted text-sm mb-16">Мұғалімге жұлдыз беріңіз</div>
      <div id="star-pick" style="display:flex;justify-content:center;gap:8px;margin-bottom:16px">
        ${[1,2,3,4,5].map(i=>`<span onclick="pickStar(${i})" style="font-size:32px;cursor:pointer;transition:transform .15s;color:var(--border)" id="s${i}">★</span>`).join('')}
      </div>
      <div id="star-reason-wrap" class="form-group" style="text-align:left">
        <label class="form-label">Себебі (міндетті емес)</label>
        <input id="star-reason" class="form-control" placeholder="мыс: Жарыста бірінші орын алды">
      </div>
    </div>`;
  openModal('star-modal');
}

function pickStar(n) {
  selectedStar = n;
  for(let i=1;i<=5;i++) {
    const el=document.getElementById('s'+i);
    el.style.color = i<=n ? '#F59E0B' : 'var(--border)';
    el.style.transform = i<=n ? 'scale(1.2)' : 'scale(1)';
  }
}

function saveStar() {
  if(!selectedStar) {showToast('Жұлдыз санын таңдаңыз','error');return;}
  const t = demoDB.find('teachers', starTeacherId);
  if(!t) return;
  const newCount = (t.starCount||0)+1;
  const newTotal = (t.totalStars||0)+selectedStar;
  const newAvg = Math.round(newTotal/newCount);
  demoDB.update('teachers', starTeacherId, {stars:newAvg, starCount:newCount, totalStars:newTotal});
  showToast(`${selectedStar} жұлдыз берілді! ⭐`,'success');
  closeModal('star-modal');
  render();
}

function openAddModal() {
  document.getElementById('modal-title').textContent='Мұғалім қосу';
  document.getElementById('edit-id').value='';
  document.getElementById('f-name').value='';
  document.getElementById('f-phone').value='';
  document.getElementById('f-pw').value='';
  document.getElementById('f-class').value='';
  document.getElementById('f-photo').value='';
  document.getElementById('f-photo').dataset.url='';
  document.getElementById('photo-preview').style.display='none';
  buildSubjChecks([]);
  openModal('teacher-modal');
}

function buildSubjChecks(selected) {
  document.getElementById('subj-checks').innerHTML = SUBJECTS.map(s=>`
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:5px 10px;background:var(--bg2);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:11px">
      <input type="checkbox" data-subj="${s}" ${selected.includes(s)?'checked':''} style="accent-color:var(--primary)">${s}
    </label>`).join('');
}

function getSelectedSubjects() {
  return Array.from(document.querySelectorAll('#subj-checks input:checked')).map(i=>i.dataset.subj);
}

function editTeacher(id) {
  const t=demoDB.find('teachers',id); if(!t) return;
  document.getElementById('modal-title').textContent='Мұғалімді өзгерту';
  document.getElementById('edit-id').value=id;
  document.getElementById('f-name').value=t.name||'';
  document.getElementById('f-phone').value=t.phone||'';
  document.getElementById('f-pw').value='';
  document.getElementById('f-class').value=t.classId||'';
  document.getElementById('f-photo').value='';
  document.getElementById('f-photo').dataset.url=t.photoURL||'';
  if(t.photoURL) {
    document.getElementById('photo-img').src=t.photoURL;
    document.getElementById('photo-preview').style.display='block';
  } else {
    document.getElementById('photo-preview').style.display='none';
  }
  buildSubjChecks(t.subjects||[]);
  openModal('teacher-modal');
}

function previewPhoto(input) {
  if(input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('photo-img').src = e.target.result;
      document.getElementById('photo-preview').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function saveTeacher() {
  const id=document.getElementById('edit-id').value;
  const name=document.getElementById('f-name').value.trim();
  const subjects=getSelectedSubjects();
  const classId=document.getElementById('f-class').value;
  if(!name){showToast('Аты-жөнін енгізіңіз','error');return;}
  if(!subjects.length){showToast('Кем дегенде бір пән таңдаңыз','error');return;}
  const btn=document.getElementById('save-btn');
  setLoading(btn,true);

  let photoURL = document.getElementById('f-photo').dataset.url || '';
  const fileInput = document.getElementById('f-photo');
  if(fileInput.files.length > 0) {
    try { photoURL = await uploadFileToStorage(fileInput.files[0]); } catch(e) { console.error(e); }
  }

  const roles=['teacher']; if(classId) roles.push('class_teacher');
  const phoneVal=document.getElementById('f-phone').value;
  const pw=document.getElementById('f-pw').value;
  const data={name,subjects,classId,roles,phone:phoneVal, photoURL};
  
  if(id) {
    demoDB.update('teachers',id,data);
    if(pw) {
      const u=demoDB.find('users',id);
      if(u) demoDB.update('users',id,{password:pw,phone:phoneVal,name,roles});
      else demoDB.add('users',{id,name,phone:phoneVal,password:pw,roles,isActive:true,createdAt:new Date().toISOString()});
    }
  } else {
    const newId=Date.now().toString(36);
    demoDB.add('teachers',{...data,id:newId,stars:0,starCount:0,totalStars:0});
    if(pw) demoDB.add('users',{id:newId,name,phone:phoneVal,password:pw,roles,isActive:true,createdAt:new Date().toISOString()});
  }
  setLoading(btn,false);
  showToast(id?'Сақталды!':'Мұғалім қосылды!','success');
  closeModal('teacher-modal');
  render();
}

function deleteTeacher(id){
  showConfirm('Мұғалімді жою','Бұл әрекетті болдырмау мүмкін емес.',()=>{
    demoDB.delete('teachers',id); showToast('Жойылды','success'); render();
  });
}

render();
</script>
</body>
</html>
